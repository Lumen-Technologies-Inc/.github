# Caller for this repository. Uses the local copy so changes to the reusable workflow review themselves.
name: claude-review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: write
  id-token: write
jobs:
  claude-review:
    uses: ./.github/workflows/claude-review.yml
    secrets: { ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}" }
